                 Fintech, productivity, real-time dashboards.">

        content="Yash Khade, Flutter Developer and Mobile Engineer">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yash Khade — Flutter Developer">

        content="Four years building cross-platform mobile apps that ship.">

  <!--
    Structured data. This is what gets Google to show your name, role and
    links as a knowledge panel rather than a plain blue link — the single
    highest-value SEO item for a Flutter web portfolio, since the canvas
    renderer gives crawlers almost no text to read.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Yash Khade",
    "jobTitle": "Flutter Developer",
    "description": "Mobile engineer building cross-platform apps with Flutter.",
    "url": "https://yashkhade.web.app",
    "image": "https://yashkhade.web.app/og-image.png",
    "email": "yk.flutter@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Pune",
      "addressRegion": "Maharashtra",
      "addressCountry": "IN"
    },
    "sameAs": [
      "https://github.com/yk-otcdesk",
      "https://linkedin.com/in/yash-khade"
    ],
    "knowsAbout": [
      "Flutter", "Dart", "Riverpod", "Bloc", "Firebase",
      "Mobile Architecture", "iOS", "Android"
    ]
  }
  </script>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0A0A0A;
      overscroll-behavior: none;
    }

    @media (prefers-color-scheme: light) {
      html, body { background: #FBFBFA; }
    }

    /*
      Flutter web shows a white flash for a second or two before the first
      frame. This holds the page in the right colour with the initials mark
      until the app paints — the difference between "loading" and "broken".
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   sans-serif;
      transition: opacity 320ms ease;
      z-index: 9999;
    }

    #boot.done { opacity: 0; pointer-events: none; }

    #boot .mark {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #F5F3EF;
    }

    #boot .bar {
      width: 120px;
      height: 1px;
      background: #262626;
      position: relative;
      overflow: hidden;
    }

    #boot .bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: #E8E0D4;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @media (prefers-color-scheme: light) {
      #boot .mark { color: #0A0A0A; }
      #boot .bar { background: #E2E2DF; }
      #boot .bar::after { background: #2B2B2B; }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot .bar::after { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
</head>

<body>
  <div id="boot">
    <div class="mark">YK</div>
    <div class="bar"></div>
  </div>

  <script>
    // Flutter fires this once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 360);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
